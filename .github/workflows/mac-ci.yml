name: Mac CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      scope:
        description: Full qualification or focused behavioral onboarding mutations
        type: choice
        options: [full, onboarding-mutations, shared-ui-format]
        default: full
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: mac-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'full' }}
  cancel-in-progress: true

env:
  PROJECT: whitenoise-mac.xcodeproj
  SCHEME: whitenoise-mac
  DESTINATION: platform=macOS

# The first four jobs below are independent by construction, so they run in
# parallel and the PR's wall clock is the slowest one rather than their sum.
# Nothing is shared between them to lose: `test` compiles Debug, `build`
# compiles Release and `analyze` compiles Debug under the analyzer, so even when
# these steps sat in one job they never reused a single object file.
#
# `coverage` is the one job that waits on another. It is deliberately thin: the
# number is measured inside `test`, where the result bundle already sits on a
# machine that has Xcode, and only the comparison against master runs here --
# on a Linux runner, in seconds. Re-measuring in its own job would mean either
# a second 20-minute test run or shipping a multi-gigabyte .xcresult between
# runners, and both buy nothing.
#
# `PR Checks` at the bottom is the aggregate gate. Keep that name: it is what
# branch protection requires, and it is the only status that has to be green.
jobs:
  # SHARED_UI_FORMAT_JOBS_BEGIN
  shared-ui-format:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'shared-ui-format'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      SHARED_UI_BASELINE: 1c0ed6f4035f36c59718865a591695c614eeb4af
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact whole-source and hosted formatting feedback only
        run: python3 scripts/ci/shared-ui-qualification.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-ui-format-${{ github.sha }}
          path: |
            build/shared-ui-qualification/result.json
            build/shared-ui-qualification/format.patch
          if-no-files-found: error
          retention-days: 7
  # SHARED_UI_FORMAT_JOBS_END
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: Static checks
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Ordered cheapest-first, and each one runs even when an earlier one
      # failed. These three checks are seconds of work apiece, so splitting them
      # across runners would buy no wall clock -- but letting a formatting slip
      # hide a missing translation would cost a whole extra round trip.
      - name: Swift format lint
        run: |
          xcrun swift-format lint \
            --configuration .swift-format \
            --recursive \
            --parallel \
            --strict \
            whitenoise-mac \
            whitenoise-macTests \
            whitenoise-macUITests

      - name: Localization coverage
        if: ${{ !cancelled() }}
        run: scripts/ci/check-localizations.sh

      # Only the steps below here resolve SwiftPM, so the cache is restored late.
      - name: Cache MarmotKit binary artifact
        if: ${{ !cancelled() }}
        uses: ./.github/actions/marmotkit-cache

      - name: Show Xcode environment
        if: ${{ !cancelled() }}
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -list -project "$PROJECT"
          xcodebuild -showTestPlans -project "$PROJECT" -scheme "$SCHEME"

      - name: macOS project sanity checks
        if: ${{ !cancelled() }}
        run: scripts/ci/macos-sanity-checks.sh

  test:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache MarmotKit binary artifact
        uses: ./.github/actions/marmotkit-cache

      - name: Unit tests
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          WN_TEST_RESULT_BUNDLE="$PWD/TestResults.xcresult" \
            scripts/test-isolated.sh -enableCodeCoverage YES

      # No `if:` on purpose. Coverage from a run whose tests failed measures a
      # partial suite, and publishing that number would quietly lower the
      # baseline for every PR that follows.
      - name: Measure code coverage
        run: |
          scripts/ci/coverage.sh \
            --output coverage/coverage.txt \
            --warnings-file coverage/uncovered-files.txt

      # This artifact is read twice: by the `coverage` job of this same run, and
      # -- when this run is a green push to master -- by the `coverage` job of
      # every later pull request, as the baseline. Retention is therefore the
      # window in which master is still comparable, not a debugging window.
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: mac-coverage
          path: coverage/
          retention-days: 90

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-unit-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: Release build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache MarmotKit binary artifact
        uses: ./.github/actions/marmotkit-cache

      - name: Release build smoke (arm64)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

  analyze:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: Static analysis
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Cache MarmotKit binary artifact
        uses: ./.github/actions/marmotkit-cache

      - name: Analyze Debug build
        run: |
          set -o pipefail
          xcodebuild analyze \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO

  coverage:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test

    permissions:
      contents: read
      # `gh run download` reads another workflow run's artifacts.
      actions: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download this run's coverage
        uses: actions/download-artifact@v4
        with:
          name: mac-coverage
          path: pr-coverage

      # Every green run publishes its own coverage, so master's most recent one
      # is already the baseline -- there is no separate "save baseline" step to
      # keep in sync, and no third-party coverage service in the loop. A missing
      # artifact is an ordinary state (the first run after this check lands, or
      # a master run older than the retention window above), so the download is
      # allowed to fail and the comparison reports the bare number instead.
      #
      # `--event push` is not redundant with `--branch master`: a pull request
      # opened from a fork's own `master` also reports `master` as its head
      # branch, and that fork's coverage is not this repository's baseline.
      - name: Download master's coverage baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow mac-ci.yml \
            --branch master \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "No successful master run to take a baseline from."
            exit 0
          fi
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name mac-coverage \
            --dir master-coverage

      # On a push to master there is no `master-coverage/` directory and none is
      # wanted: that run is the baseline, so this reports the number and passes.
      - name: Compare against master
        run: |
          scripts/ci/compare-coverage.sh \
            --current pr-coverage/coverage.txt \
            --baseline master-coverage/coverage.txt \
            --uncovered-file pr-coverage/uncovered-files.txt

  # Single required status for branch protection. Without this, splitting the
  # old `PR Checks` job would leave the branch gated on a check that no longer
  # reports, which reads as "waiting" forever rather than as a failure.
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full') }}
    needs: [checks, test, build, analyze, coverage]

    steps:
      - name: Report job results
        run: |
          printf 'static checks   : %s\n' "${{ needs.checks.result }}"
          printf 'unit tests      : %s\n' "${{ needs.test.result }}"
          printf 'release build   : %s\n' "${{ needs.build.result }}"
          printf 'static analysis : %s\n' "${{ needs.analyze.result }}"
          printf 'coverage        : %s\n' "${{ needs.coverage.result }}"

      # `success()` is not enough on its own: with `if: always()` a skipped or
      # cancelled dependency would otherwise let the gate pass.
      - name: Fail if any job did not succeed
        if: >-
          ${{ needs.checks.result != 'success'
           || needs.test.result != 'success'
           || needs.build.result != 'success'
           || needs.analyze.result != 'success'
           || needs.coverage.result != 'success' }}
        run: |
          echo "::error::One or more Mac CI jobs did not succeed."
          exit 1

  onboarding-mutations:
    name: Onboarding behavioral mutation qualification
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'onboarding-mutations'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate and reviewed baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source and result parser controls
        run: python3 scripts/ci/onboarding-mutations.py --preflight
      - name: Remote focused format preflight and feedback
        run: |
          python3 - <<'PYFORMAT'
          import difflib
          from pathlib import Path
          import subprocess
          files = ['whitenoise-mac/Features/Onboarding/OnboardingCoordinator.swift',
                   'whitenoise-mac/Views/Onboarding/OnboardingView.swift',
                   'whitenoise-macTests/AddProfileRoutingTests.swift',
                   'whitenoise-macTests/AccountSetupGuideTests.swift']
          output = Path('build/onboarding-format')
          output.mkdir(parents=True, exist_ok=True)
          lint = subprocess.run(['xcrun', 'swift-format', 'lint', '--configuration', '.swift-format', '--strict', *files])
          if lint.returncode:
              patch = []
              for name in files:
                  formatted = subprocess.run(['xcrun', 'swift-format', 'format', '--configuration', '.swift-format', name], capture_output=True, text=True, check=True).stdout
                  patch.extend(difflib.unified_diff(Path(name).read_text().splitlines(True), formatted.splitlines(True), fromfile='a/' + name, tofile='b/' + name))
              (output / 'feedback.patch').write_text(''.join(patch))
          raise SystemExit(lint.returncode)
          PYFORMAT
      - name: Cache MarmotKit binary artifact
        uses: ./.github/actions/marmotkit-cache
      - name: Run baseline, runtime mutants and exact restored controls
        run: python3 scripts/ci/onboarding-mutations.py
      - name: Preserve compact qualification and failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-mutation-qualification
          path: |
            build/onboarding-mutations/result.json
            build/onboarding-mutations/*.json
            build/onboarding-mutations/*.log
            build/onboarding-format/feedback.patch
          if-no-files-found: warn
          retention-days: 14
