name: Shared UI source qualification
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [format-only]
        default: format-only
permissions:
  contents: read
concurrency:
  group: shared-ui-qualification-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false
jobs:
  format:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'format-only'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      SHARED_UI_BASELINE: 1c0ed6f4035f36c59718865a591695c614eeb4af
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact whole-source and hosted formatting feedback only
        run: python3 scripts/ci/shared-ui-qualification.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-ui-format-${{ github.sha }}
          path: |
            build/shared-ui-qualification/result.json
            build/shared-ui-qualification/format.patch
          if-no-files-found: error
          retention-days: 7
